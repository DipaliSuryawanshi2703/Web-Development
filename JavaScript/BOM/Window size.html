<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <button id="btn">Ok</button>
   <pre id="out"></pre>
   <script>
    document.getElementById("btn").addEventListener("click",()=>{
        document.getElementById("out").textContent ="Width : " + window.innerWidth + "Height : " + window.innerHeight
    });
   </script> 
</body>
</html>
