<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="" id="name"placeholder="Enter The Name">
    <input type="number" name="" id="age" placeholder="Enter Age">
    <button onclick="AddStudent()">Save</button>

    <div id="output"></div>
    <script>
        class student{
            constructor(name,age){
               this.name = name;
               this.age = age;

            }
            display(){
               return `Name : ${ this.name},
                        Age : ${this.age}`
            }
        }
      let students = [];
       function AddStudent(){
         let Name = document.getElementById("name").value;
         let Age = document.getElementById("age").value;
        
        let objStudent = new student(Name,Age);
        students.push(objStudent);
        document.getElementById("output").innerHTML +="<p>" + objStudent.display() +"</p>";
       } 
    </script>
</body>
</html>
