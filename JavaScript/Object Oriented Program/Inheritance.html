<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Employee Details</h3>
    <button onclick ="ShowDev()">Show Developer</button>
    <button onclick ="ShowMan()">Show Manager</button>
    <p id="output"></p>
    <script>
        class Employee{
            constructor(name ,salary){
                this.name = name;
                this.salary =salary;
            }
            GetDetails(){
                return `Name: ${this.name} Earn Rs: ${this.salary}`
            }
        }
        class Developer extends Employee{
           constructor(name,salary,language){
            super(name,salary);
            this.language = language;
           }
           GetDetails(){
            return `${super.GetDetails()} Work On ${this.language}.`
           }
        }
        class Manager extends Employee{
            constructor(name,salary,teamsize){
                super(name,salary);
                this.teamsize = teamsize;
            }
            GetDetails(){
                return`${super.GetDetails()} Teamsize is ${this.teamsize}`
            }
        }
        let developer = new Developer("Suraj",35000,"Angular");
        let manager = new Manager("Sudhir",75000,21);

        function ShowDev(){
            document.getElementById("output").innerText = developer.GetDetails();
        }
        function ShowMan(){
            document.getElementById("output").innerText = manager.GetDetails();
        }
    </script>

</body>

</html>
