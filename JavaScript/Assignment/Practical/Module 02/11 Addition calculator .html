<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Addition Calculator</title>
    <style>
        body{
            margin: 0px;
            padding: 0px;
            background-color: rgb(202, 199, 199);
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
           justify-content: center;
           align-items: center;
        }
        .calculator{
            background-color: whitesmoke;
            border-radius: 10px;
            margin-top: 200px;
            padding: 30px;
            height: 25vh;
            box-shadow: 0px 0px 5px 5px rgb(104, 105, 104);
            
        }
        input[type="number"]{
           height: 20px;
           margin: 10px;
        }
        button{
            padding:8px;
            margin: 8px;
            border-radius: 10px ;
            box-shadow: 0px 0px 2px 2px rgb(104, 105, 104);
            background-color: rgb(1, 51, 1);
            color: aliceblue;
        }
        h2{
            color: rgb(65, 65, 247);
        }
        button:hover{
            background-color: rgb(2, 121, 2);
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>Addition Calculator</h2>
        <input type="number" id="num1" placeholder="First number">
        +
        <input type="number" id="num2" placeholder="Second number">
        <br>
        <button onclick="calculate()">Calculate</button>
        <button onclick="ClearAll()">Refresh</button>
        <div id="result"></div>
    </div>

    <script>
       
        function calculate()
        {
                var No1 = parseFloat(document.getElementById("num1").value);          
                var No2 = parseFloat(document.getElementById("num2").value); 
               if(isNaN(No1)|| isNaN(No2))
            {
                document.getElementById("result").innerText = "Please Enter The Valid Number";
            }
                let Sum ;
                Sum = No1 + No2;
                document.getElementById("result").innerText= "Result : " + Sum;
         }
         function ClearAll(){
            document.getElementById("num1").value="";
             document.getElementById("num2").value="";
             document.getElementById("result").innerText="";
         }
    </script>

</body>
</html>
