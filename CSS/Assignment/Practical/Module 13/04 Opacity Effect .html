<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opacity Effect </title>
  <style>
    .box {
      width: 200px;
      height: 100px;
      margin: 10px;
      background-color: blue;
      color: white;
      display: inline-block;
      text-align: center;
      line-height: 100px;
      font-weight: bold;
    }

    .normal {
      opacity: 1; /* Fully visible */
    }

    .reduced {
      opacity: 0.4; /* Semi-transparent */
    }
  </style>
</head>
<body>

  <div class="box normal">
    Normal Opacity
  </div>

  <div class="box reduced">
    Reduced Opacity
  </div>

</body>
</html>
