<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Position Element</title>
</head>
<body>
    <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    /* Fixed header */
    .header {
      position: fixed; /* Stays fixed on screen */
      top: 0;          /*  the top */
      left: 0;
      width: 100%;
      background-color: #333;
      color: white;
      padding: 15px;
      text-align: center;
      z-index: 1000;   /* stays on top */
    }

    /* Content to show scrolling effect */
    .content {
      margin-top: 70px; /* Leave space for fixed header */
      padding: 20px;
      height: 1000px;   /* Make page scrollable */
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <div class="header">
    Fixed Header
  </div>

  <div class="content">
    Scroll down to see that the header stays fixed at the top of the page.
  </div>

</body>
</html>
