<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>z-index Demonstration </title>
</head>
<body>
    <style>
    .box {
      width: 150px;
      height: 150px;
      position: absolute; /* Required for z-index to work */
      color: white;
      text-align: center;
      line-height: 150px;
      font-weight: bold;
      opacity: 0.9;
    }

    .box1 {
      background-color: red;
      top: 50px;
      left: 50px;
      z-index: 1; /* Appears behind box2 */
    }

    .box2 {
      background-color: blue;
      top: 100px;
      left: 100px;
      z-index: 2; /* Appears on top of box1 */
    }
  </style>
</head>
<body>

  <div class="box box1">Box 1</div>
  <div class="box box2">Box 2</div>
</body>
</html>
