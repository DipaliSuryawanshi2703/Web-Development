
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Layout</title>
 <style>
    body {
  margin: 0;
  font-family: Arial, sans-serif;
}

.container {
  display: grid;

  /* 2 columns: fixed sidebar + flexible content */
  grid-template-columns: 250px 1fr;

  /* 3 rows: header, content, footer */
  grid-template-rows: 60px 1fr 50px;

  /* Define layout areas */
  grid-template-areas:
    "header header"
    "sidebar main"
    "footer footer";

  height: 100vh;
}

/* Assign areas */
header {
  grid-area: header;
  background: #2c3e50;
  color: white;
  display: flex;
  align-items: center;
  padding-left: 20px;
}

aside {
  grid-area: sidebar;
  background: #34495e;
  color: white;
  padding: 20px;
}

main {
  grid-area: main;
  background: #ecf0f1;
  padding: 20px;
}

footer {
  grid-area: footer;
  background: #2c3e50;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}
 </style>
</head>
<body>
  <div class="container">
    <header>Header</header>
    <aside>Sidebar</aside>
    <main>Main Content</main>
    <footer>Footer</footer>
  </div>
</body>
</html>
