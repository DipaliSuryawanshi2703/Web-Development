<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid Span Layout</title>
  <style>
    body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

.grid {
  display: grid;

  /* 3 equal columns */
  grid-template-columns: repeat(3, 1fr);

  gap: 15px;
  padding: 20px;
}

.item {
  background: #3498db;
  color: white;
  padding: 40px;
  text-align: center;
  border-radius: 8px;
}

/* Featured item spans 2 columns */
.featured {
  grid-column: span 2;
  background: #e74c3c;
}
  </style>
</head>
<body>

  <div class="grid">
    <div class="item featured">Featured Item</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
    <div class="item">Item 4</div>
    <div class="item">Item 5</div>
  </div>

</body>
</html>
