<!DOCTYPE html>
<html>
<head>
  <title>Overlapping Grid Items</title>
  <style>
    /* Grid Container */
.grid-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: 150px 150px;
  gap: 10px;
  padding: 10px;
  background-color: lightgray;
}

/* Common item styles */
.item {
  color: white;
  padding: 20px;
  text-align: center;
}

/* Item placements */
.item1 {
  background-color: teal;
  grid-column: 1 / 3;
  grid-row: 1;
}

.item2 {
  background-color: crimson;
  grid-column: 2 / 4;
  grid-row: 1 / 3;
  z-index: 2; /* Brings it above item1 */
  opacity: 0.9;
}

.item3 {
  background-color: purple;
  grid-column: 1 / 2;
  grid-row: 2;
}
  </style>
</head>
<body>

<div class="grid-container">
  <div class="item item1">Item 1</div>
  <div class="item item2">Item 2 (Overlapping)</div>
  <div class="item item3">Item 3</div>
</div>

</body>
</html>
