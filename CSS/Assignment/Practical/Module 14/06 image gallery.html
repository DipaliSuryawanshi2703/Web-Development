<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gallery</title>
  <style>
    body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

.gallery {
  display: grid;

  /* Create equal columns */
  grid-template-columns: repeat(3, 1fr);

  /* Equal spacing between rows & columns */
  gap: 15px;

  padding: 20px;
}

.gallery img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
}
  </style>
</head>
<body>

  <div class="gallery">
    <img src="https://picsum.photos/300?1" alt="Image 1">
    <img src="https://picsum.photos/300?2" alt="Image 2">
    <img src="https://picsum.photos/300?3" alt="Image 3">
    <img src="https://picsum.photos/300?4" alt="Image 4">
    <img src="https://picsum.photos/300?5" alt="Image 5">
    <img src="https://picsum.photos/300?6" alt="Image 6">
  </div>

</body>
</html>
