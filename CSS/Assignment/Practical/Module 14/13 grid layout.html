<!DOCTYPE html>
<html>
<head>
  <title>Named Grid Lines</title>

  <style>
    /* Grid with Named Lines */
    .grid-container {
      display: grid;
      grid-template-columns: 
        [left] 1fr 
        [middle] 2fr 
        [right] 1fr;
        
      grid-template-rows: 
        [top] auto 
        [center] auto 
        [bottom] auto;

      gap: 10px;
      padding: 10px;
      background-color: lightgray;
    }

    /* Common styles */
    .item {
      padding: 20px;
      color: white;
      text-align: center;
    }

    /* Placing items using named lines */
    .header {
      background: teal;
      grid-column: left / right;
      grid-row: top;
    }

    .sidebar {
      background: orange;
      grid-column: left / middle;
      grid-row: center;
    }

    .content {
      background: purple;
      grid-column: middle / right;
      grid-row: center;
    }

    .footer {
      background: gray;
      grid-column: left / right;
      grid-row: bottom;
    }
  </style>

</head>
<body>

<div class="grid-container">
  <div class="item header">Header</div>
  <div class="item sidebar">Sidebar</div>
  <div class="item content">Content</div>
  <div class="item footer">Footer</div>
</div>

</body>
</html>
