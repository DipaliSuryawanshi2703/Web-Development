<!DOCTYPE html>
<html>
<head>
  <title>Asymmetric Grid Layout</title>
  <style>
    /* Grid Container */
.grid-container {
  display: grid;
  grid-template-columns: 1fr 2fr 3fr; /* Asymmetric columns */
  gap: 10px;
  padding: 10px;
  background-color: lightgray;
}

/* Grid Items */
.box {
  color: white;
  padding: 20px;
  text-align: center;
}

/* Different colors for clarity */
.small {
  background-color: teal;
}

.medium {
  background-color: orange;
}

.large {
  background-color: purple;
}
  </style>
</head>
<body>

<div class="grid-container">
  <div class="box small">Small (1fr)</div>
  <div class="box medium">Medium (2fr)</div>
  <div class="box large">Large (3fr)</div>
</div>

</body>
</html>
