<!DOCTYPE html>
<html>
<head>
  <title>Masonry Grid Layout</title>
  <style>
    /* Grid Container */
.grid-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: 100px; /* Base row height */
  gap: 10px;
  padding: 10px;
  background-color: lightgray;
}

/* Card styles */
.card {
  background-color: steelblue;
  color: white;
  padding: 10px;
  border-radius: 8px;
}

/* Different heights using row span */
.small {
  grid-row: span 1;
}

.medium {
  grid-row: span 2;
}

.large {
  grid-row: span 3;
}
  </style>
</head>
<body>

<div class="grid-container">
  <div class="card small">Card 1</div>
  <div class="card medium">Card 2</div>
  <div class="card large">Card 3</div>
  <div class="card medium">Card 4</div>
  <div class="card small">Card 5</div>
  <div class="card large">Card 6</div>
</div>

</body>
</html>
