<!DOCTYPE html>
<html>
<head>
  <title>Nested Grid Layout</title>
  <style>
    /* Main Grid */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 2fr 1fr;
  gap: 10px;
  padding: 10px;
  background-color: lightgray;
}

/* Main grid items */
.item {
  background-color: steelblue;
  color: white;
  padding: 20px;
  text-align: center;
}

/* Nested Grid (inside one item) */
.nested-grid {
  display: grid; /* Important: make it a grid separately */
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  background-color: lightcoral;
  padding: 10px;
}

/* Inner items */
.inner {
  background-color: white;
  padding: 15px;
  text-align: center;
}
  </style>
</head>
<body>

<div class="main-grid">
  <div class="item">Item 1</div>
  
  <div class="nested-grid">
    <div class="inner">Inner 1</div>
    <div class="inner">Inner 2</div>
    <div class="inner">Inner 3</div>
    <div class="inner">Inner 4</div>
  </div>
  
  <div class="item">Item 3</div>
</div>

</body>
</html>
