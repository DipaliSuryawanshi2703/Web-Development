<!DOCTYPE html>
<html lang="en">
<head>

    <title>Structural Pseudo-class </title>
    <style>
       ul :first-child{color: rgb(175, 233, 233);}
       ul:nth-child(even){color: brown;}
       ul:nth-child(odd){color: rgb(245, 119, 161);}
    </style>
</head>
<body>
    <ul>
        <li>12</li>
        <li>Aarti</li>

    </ul>
    <ul>

    <li>Suraj</li>
    <li>Bsc</li>
    <li>5467890215</li>
</ul>
    <ul>
        <li>14</li>
    <li>Shivani</li>
    <li>BE</li>
    <li>2345678906</li>
</ul>
    <ul>
        <li>15</li>
    <li>Priya</li>

</ul>
</body>
</html>
