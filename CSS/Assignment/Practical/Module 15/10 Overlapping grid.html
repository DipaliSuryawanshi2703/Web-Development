<!DOCTYPE html>
<html>
<head>
    <title>Overlapping Grid Items</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 150px 150px;
            gap: 10px;
            padding: 10px;
            position: relative; /* allow absolute positioning if needed */
        }

        .item {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 18px;
            border-radius: 5px;
        }

        /* Overlapping item */
        .overlap {
            background-color: #f44336;
            grid-column: 2 / 4; /* spans column 2 and 3 */
            grid-row: 1 / 3;    /* spans both rows */
            z-index: 1;         /* brings it above other items */
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <h2>Overlapping Grid Items Example</h2>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item overlap">Overlapping Item</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
    </div>

</body>
</html>
