<!DOCTYPE html>
<html>
<head>
    <title>Grid Item Spanning Rows and Columns</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 120px);
            gap: 10px;
            padding: 10px;
            background-color: #f2f2f2;
        }

        .item {
            background-color: #3f51b5;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 18px;
            border-radius: 5px;
        }

        .main {
            background-color: #e91e63;
            grid-column: span 2; /* spans 2 columns */
            grid-row: span 2;    /* spans 2 rows */
        }
    </style>
</head>
<body>

    <h2>Grid Layout with Spanning Item</h2>

    <div class="container">
        <div class="item main">Main Item</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
    </div>

</body>
</html>
