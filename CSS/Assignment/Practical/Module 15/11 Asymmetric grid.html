<!DOCTYPE html>
<html>
<head>
    <title>Asymmetric Grid Layout</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 3fr; /* unequal columns */
            grid-template-rows: 150px 150px;
            gap: 10px;
            padding: 10px;
        }

        .item {
            background-color: #2196F3;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 18px;
            border-radius: 5px;
        }

        .item:nth-child(odd) {
            background-color: #4CAF50;
        }
    </style>
</head>
<body>

    <h2>Asymmetric Grid Layout Example</h2>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
        <div class="item">Item 6</div>
    </div>

</body>
</html>
