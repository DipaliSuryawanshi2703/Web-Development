<!DOCTYPE html>
<html>
<head>
    <title>Full Screen Grid Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            height: 100vh; /* full viewport height */
            grid-template-rows: 80px 1fr 60px; /* header, main, footer */
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .main {
            background-color: #ecf0f1;
            padding: 20px;
            overflow-y: auto; /* scroll if content overflows */
        }

        .footer {
            background-color: #34495e;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">Header</div>
        <div class="main">
            <h2>Main Content Area</h2>
            <p>This is the main content section that expands to fill the available space between header and footer.</p>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse pretium lacus in turpis pharetra, vel sollicitudin lorem euismod.</p>
        </div>
        <div class="footer">Footer</div>
    </div>

</body>
</html>
