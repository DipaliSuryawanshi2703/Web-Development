<!DOCTYPE html>
<html>
<head>
    <title>Responsive Card Layout</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .card p {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>Responsive Card Layout</h2>

    <div class="container">
        <div class="card">
            <h3>Card 1</h3>
            <p>Some description here.</p>
        </div>
        <div class="card">
            <h3>Card 2</h3>
            <p>Some description here.</p>
        </div>
        <div class="card">
            <h3>Card 3</h3>
            <p>Some description here.</p>
        </div>
        <div class="card">
            <h3>Card 4</h3>
            <p>Some description here.</p>
        </div>
        <div class="card">
            <h3>Card 5</h3>
            <p>Some description here.</p>
        </div>
    </div>

</body>
</html>
