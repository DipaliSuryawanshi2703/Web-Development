<!DOCTYPE html>
<html>
<head>
    <title>Grid Template Areas Layout</title>
    <style>
        .container {
            display: grid;
            grid-template-areas:
                "header header header"
                "sidebar main main"
                "footer footer footer";
            grid-template-columns: 1fr 2fr 2fr;
            grid-template-rows: 80px 300px 80px;
            gap: 10px;
            padding: 10px;
            height: 100vh;
        }

        .header {
            grid-area: header;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #2196F3;
            color: white;
            padding: 20px;
        }

        .main {
            grid-area: main;
            background-color: #f44336;
            color: white;
            padding: 20px;
        }

        .footer {
            grid-area: footer;
            background-color: #555;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h2>Webpage Layout using Grid Areas</h2>

    <div class="container">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="main">Main Content</div>
        <div class="footer">Footer</div>
    </div>

</body>
</html>
