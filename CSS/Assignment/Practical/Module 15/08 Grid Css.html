<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Layout using CSS Grid</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: grid;
            grid-template-columns: 250px 1fr; /* fixed sidebar + flexible main */
            grid-template-rows: 70px 1fr 60px;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            height: 100vh;
        }

        .header {
            grid-area: header;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #34495e;
            color: white;
            padding: 20px;
        }

        .main {
            grid-area: main;
            background-color: #ecf0f1;
            padding: 20px;
        }

        .footer {
            grid-area: footer;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">Dashboard Header</div>
        <div class="sidebar">Sidebar Menu</div>
        <div class="main">Main Content Area</div>
        <div class="footer">Footer</div>
    </div>

</body>
</html>
