<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <link href="https://fonts.google.com/specimen/Roboto" rel="stylesheet">
   <style>
      * {
         font-family: 'Roboto' sans-serif;
         margin: 0px;
         padding: 0%;
      }

      .header {
         display: flex;
         align-items: center;
         justify-content: space-between;
         background-color: rgb(57, 57, 138);
         color: white;
         height: 70px;
         flex-wrap: wrap;
         position: relative;

      }

      .navbar {
         align-items: end;
         display: flex;
         flex-wrap: nowrap;
         cursor: pointer;
      }

      nav {
         display: flex;
         max-width: 100%;
         gap: 10px;
         word-spacing: "|";
      }

      a {
         text-decoration: none;
         letter-spacing: 1px;
         color: white;
         font-size: 20px;
      }

      .navbar a:hover {
         color: #aee4eb;
      }

      .item::after {
         content: "";
         border-left: 2px solid white;
         margin: 0 10px;
      }

      .item:last-child::after {
         border: none;
      }

      .section-1 {
         display: flex;
         align-items: center;
         justify-content: space-between;
         background-color: rgb(0, 0, 48);
         flex: 1 1 200px;
         min-height: 400px;

      }


      .backtext {
         background-color: rgb(0, 0, 48);
         width: 50%;
         color: white;
         flex: 1 1 300;
         text-align: center;
         align-content: center;
         font-size: 30px;
      }

      .backimg {
         background-image: url("./Background.jpg");
         background-repeat: no-repeat;
         background-size: cover;
         background-position: center;
         width: 50%;
         flex: 1 1 300px;


      }

      .logo-container {
         display: flex;
         gap: 20px;
         height: 70px;
         align-items: center;
         justify-content: end;
         padding-right: 20px;
        
      }

      .logo-container img {
         cursor: pointer;
         height: 20px;
         width:20px;
      }

      .imgpart {
         height: 300px;

      }
      .section-2 {
         padding-top: 100px;
         height: 80px;
         background-color: rgb(246, 247, 248);
         text-align: center;
      }

      .Section-3 {
         background-color: #b5b6b6;
         height: 200px;

      }

      .container {
         display: flex;
         gap: 20px;
         justify-content: center;
         text-align: center;
      }

      .card {
         width: 30vw;
         height: 10em;
         margin-top: 20px;
         background-color: rgb(92, 92, 245);
         border-radius:100px;
         box-shadow: 0 0 10 rgb(139, 138, 138);
          text-transform:uppercase;

      }
      footer{
         height: 30px;
         background-color:rgb(57, 57, 138) ;
         text-align: right;
         line-height: 20px;
      }
   </style>
</head>

<body>
   <div class="header">
      <div class="name">
         <h1> Company Name</h1>
      </div>
      <div class="navbar">
         <nav>
            <span class=item><a href="#Home">Home</a></span>
            <span class=item><a href="#AboutUs">About</a></span>
            <span class=item><a href="#Services">Services</a></span>
            <span class=item><a href="#Contact">Contact</a></span>
         </nav>
      </div>
   </div>
   <div class="section-1">
      <div class="backtext">Welcome To Webpage</div>
      <div class="backimg">
         <div class="logo-container">
            <a href="http://google.com"><img src="./google.png" alt="Linkedin link"></a>
            <a href="http://facebook.com"><img src="./facebook.png" alt="Facebook Link"></a>
            <a href="http://twitter.com"><img src="./twitter.png" alt="Twitter link"></a>
         </div>
         <div class="imgpart"></div>
      </div>
   </div>
   <div class="section-2">
      <h2>What We Are</h2>
      <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Totam, impedit.</p>
   </div>
   <div class="Section-3">
      <div class="container">

         <div class="card"id="AboutUs">About Us</div>
         <div class="card">Servies</div>
         <div class="card">Contact</div>

      </div>
   </div>
   <footer>
      <p>Email:companyname@gmail.com</p>
   </footer>


</body>

</html>
