<!DOCTYPE html>

<html>
<head>
<title>Margin Demo</title>

<style>
.box {
    width: 200px;
    height: 100px;
    padding: 15px;
    background-color: lightblue;
    border: 2px solid black;
    font-size: 16px;
    margin-bottom: 20px;  /* Creates space between boxes */
}
</style>

</head>
<body>

<div class="box">
    This is the first box.
</div>

<div class="box">
    This is the second box.
</div>

</body>
</html>
