<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing – border-box </title>
    <style>
        .box{
            width: 400px;
            padding: 30px;
            border: 3px solid black;
            background-color: aquamarine;
            box-sizing:border-box ;
        }
    </style>
</head>
<body>
    <h2>Border-box</h2>

<div class="box">
    Border-box example
</div>

</body>
</html>
