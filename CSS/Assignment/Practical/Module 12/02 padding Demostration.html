<!DOCTYPE html>

<html>
<head>
<title>Padding Demo</title>

<style>
.box{
    width: 300px;
    border: 2px solid black;
    padding: 20px;           /* Equal padding on all sides */
    background-color: lightblue;
    font-size: 18px;
}
</style>

</head>

<body>

<div class="box">
    This is a box with equal padding on all sides. The background color helps to show the padding clearly.
</div>

</body>
</html>
