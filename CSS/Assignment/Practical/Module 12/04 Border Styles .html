<!DOCTYPE html>

<html>
<head>
<title>Border Styles Demo</title>

<style>
.box {
    width: 250px;
    height: 100px;
    padding: 15px;
    margin: 20px;
    background-color: lightyellow;
    font-size: 16px;
}

/* Different border styles */
.solid-border {
    border: 3px solid black;
}

.dashed-border {
    border: 3px dashed green;
}

.dotted-border {
    border: 3px dotted blue;
}
</style>

</head>
<body>

<div class="box solid-border">
    This box has a solid border.
</div>

<div class="box dashed-border">
    This box has a dashed border.
</div>

<div class="box dotted-border">
    This box has a dotted border.
</div>

</body>
</html>
