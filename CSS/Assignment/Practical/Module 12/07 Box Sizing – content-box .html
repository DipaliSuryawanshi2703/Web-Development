<!DOCTYPE html>

<html>
<head>
<title>Box Sizing Comparison</title>

<style>
.box {
    width: 200px;
    padding: 20px;
    border: 5px solid black;
    font-size: 16px;
    margin: 20px auto;
    text-align: center;
    background-color: lightcoral;
}

/* Content-box (default) */
.content-box {
    box-sizing: content-box;
}

/* Border-box */
.border-box {
    box-sizing: border-box;
    background-color: lightgreen;
}
</style>

</head>

<body>

<h2>Content-box (Default)</h2>
<p>Width = 200px, padding = 20px, border = 5px → Actual width = 250px</p>
<div class="box content-box">
    Content-box example
</div>

<h2>Border-box</h2>
<p>Width = 200px, padding = 20px, border = 5px → Actual width = 200px</p>
<div class="box border-box">
    Border-box example
</div>

</body>
</html>
