<!DOCTYPE html>

<html>
<head>
<title>Different Padding Demo (Shorthand)</title>

<style>
.div-padding{
    width: 300px;
    border: 2px solid black;
    padding: 10px 20px 30px 40px; /* top right bottom left */
    background-color: lightcoral;
    font-size: 16px;
}
</style>

</head>
<body>

<div class="div-padding">
    This div has different padding values for top, right, bottom, and left sides using shorthand property.
</div>

</body>
</html>
