<!DOCTYPE html>

<html>
<head>
<title>Center Box Demo</title>

<style>
.box {
    width: 300px;               /* Set box width */
    height: 150px;              /* Set box height */
    background-color: lightgreen;
    border: 2px solid black;
    padding: 20px;
    margin: 0 auto;             /* Horizontally center the box */
    font-size: 16px;
    text-align: center;         /* Optional: center text inside box */
}
</style>

</head>

<body>

<div class="box">
    This box is centered horizontally using <strong>margin: auto</strong>.
</div>

</body>
</html>
