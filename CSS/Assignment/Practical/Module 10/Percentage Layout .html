<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Layout</title>
    <style>
        body {
            display: grid;
            justify-content: center;
            place-items: center;
            margin-top: 100px;
        }

        .container {
            background-color: azure;
            width: 800px;
            height: 800px;
            align-items: center;
            display: flex;

        }

        .col1 {
            background-color: rgb(224, 8, 8);
            flex-basis: 70%;
            height: 500px;
            font-size: 90px;
        }

        .col2 {
            background-color: blue;
            flex-basis: 30%;
            height: 500px;
            font-size: 90px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="col1">Column 1</div>
        <div class="col2">Column 2</div>
    </div>
</body>

</html>
