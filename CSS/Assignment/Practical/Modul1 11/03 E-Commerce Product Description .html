<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Product Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body{
            margin: 0px;
            padding: 0px;
            font-family:'Roboto';
        }
        .name{
            font-size: 50px;
            background-color: teal;
            color: whitesmoke;
        }
        .product{
            display: inline-block;
           
         }
         .Details{
            height: 100px;
            background-color: rgb(240, 241, 241);
            margin-top: 20px;
            width: 400px;
            box-shadow: 0 0 15px rgb(143, 141, 141);
         }
         .PName{
            font-weight: bold;
            font-size: 20px;
                
        }
        .old-price{
            text-decoration: line-through;
        }
        .New-price{
         font-size: 20px;
         color: red;
         font-weight: bold;
         font-style: italic;
        }
        
        
    </style>
</head>

<body>
    <header>
        <div>
            <div class="name">E-Commerce Website</div>
            <div class="logo"></div>
        </div>
        <div class="product">
            <div class="Details">
                <div class="PName"> Power Cabel <br></div>
                <div class="price">
                    <span class="old-price">Rs.250</span>
                    <span class="New-price">Rs.200</span>
                </div>
            </div>
            <div class="Details">
            <div class="PName"> Wireless Mouse-Keyboard<br></div>
            <div class="price">
                <span  class="old-price">Rs. 550</span>
                <span  class="New-price">Rs. 480</span>

            </div>
            </div>
        
        <div class="Details">
            <div class="PName"> Wireless bluetooth <br></div>
            <div class="price">
                <span  class="old-price">Rs.890</span>
                <span  class="New-price">Rs.790</span>
            </div>
        </div>
        </div>
    </header>
</body>

</html>
