<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institute Website Intro Section </title>
</head>
<style>
    body {
        background-color: #faf8f8;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    .section1 {
        height: 80px;
        background-color:rgb(238, 238, 238);
        color: navy;
        text-align: center;
        display: flex;
        justify-content: center;
        letter-spacing: 2px;
        padding-top: 10px;
        padding-bottom: 30px;

    }

    nav {
        padding-top: 80px;
        text-align: center;
        gap: 20px;
        display: flex;
    }

    nav a {
        text-decoration: none;
        font-size: 20px;
        color: rgb(240, 4, 63);
    }

    .container {
        display: flex;
        justify-content: center;
        column-gap: 20px;
    }

    .card {
        height: 150px;
        width: 400px;
        background-color: rgb(250, 250, 250);
        border-radius: 10px;
        box-shadow: 0 0 10px rgb(194, 193, 193);
        margin-top: 20px;
        color: rgb(19, 2, 51);
        font-size: 20px;
    }

    .section2 {
        display: flex;
        justify-content: center;
        gap:unset;

    }

    .text {
        height: 50vh;
        width: 50vw;
        text-align: left;
        margin-top: 20px;
        background-color: white;

    }
    text, h2{
        color: yellowgreen;
    }

    .image {
        height: 50vh;
        width: 50vw;
        margin-top: 20px;
        background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRX71G28V9N4PSbCPA0kZ5dTOABYPW9IozX_Q&s");
        background-repeat: no-repeat;
        background-size: contain;
        background-color: white;
    }
    footer{
        background-color:navy;
        color: whitesmoke;
        text-align: center;
        font-size: 30px;
        padding: 3px;
       
    }
</style>

<body>
    <header>
        <div class="section1"id="Home">
            <h1> Fork Infosystems</h1>
            <nav>
                <a href="#Home">Home</a>
                <a href="#About">About</a>
                <a href="#Contact">Contact</a>
            </nav>
        </div>
    </header>
    <div class="main">
        <div class="container">
            <div class="card">Our Service</div>
            <div class="card">Online Course</div>
            <div class="card">Faculty</div>
        </div>
        <div class="section2">
            <div class="image">
            </div>
            <div class="text" id="About">
                <h2 Class="AboutUs"> About Us</h2>
                <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Esse iste laudantium repudiandae tenetur
                    veniam quisquam cupiditate impedit voluptatibus blanditiis earum?</p>
            </div>

        </div>

    </div>
    <footer id="Contact">
        <p> +91 8978678954   forkinfosystems@gmail.com</p>
    </footer>

</body>

</html>
