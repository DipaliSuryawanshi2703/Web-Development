<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            height: 100vh;
        }

        .sidebar {
            flex: 25%;
            background: #f4f4f4;
            padding: 20px;
           
        }

        .content {
            flex: 75%;
            padding: 20px;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            width: 100%;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .sidebar, .content {
                flex: 100%;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            header {
                font-size: 18px;
            }

            .content {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>My Responsive Website</h1>
</header>

<div class="container">
    <div class="sidebar">
        <h2>Sidebar</h2>
        <p>Links / Menu</p>
    </div>

    <div class="content">
        <h2>Main Content</h2>
        <p>This layout adjusts based on screen size.</p>
    </div>
</div>

<footer>
    <p>© 2026 My Website</p>
</footer>

</body>
</html>
