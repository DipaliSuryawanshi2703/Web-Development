<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Responsive Navbar</title>

<style>
    body {
        margin: 0;
        font-family: Arial;
    }

    nav {
        background: #333;
    }

    ul {
        list-style: none;
        display: flex;
        justify-content: end;
        padding: 0;
        margin: 0;
    }

    ul li {
        padding: 15px 20px;
    }

    ul li a {
        color: white;
        text-decoration: none;
    }

    ul li:hover {
        background: #555;
    }

    /*  Mobile */
    @media (max-width: 768px) {
        ul {
            flex-direction: column;   /* horizontal → vertical */
            align-items: center;
        }

        ul li {
            width: 100%;
            text-align: center;
            border-top: 1px solid #444;
        }
    }
</style>
</head>

<body>

<nav>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

</body>
</html>
