<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Card Layout</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f4f4f4;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .card-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 8px rgba(0,0,0,0.2);
        text-align: center;
        transition: transform 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
    }

    .card img {
        width: 100%;
        border-radius: 5px;
        margin-bottom: 15px;
    }

    .card h3 {
        margin-bottom: 10px;
    }

    .card p {
        font-size: 0.95rem;
        color: #555;
    }
</style>
</head>

<body>

<h1>Responsive Card Layout</h1>

<div class="card-container">
    <div class="card">
        <img src="https://picsum.photos/id/101/300/200" alt="Card 1">
        <h3>Card 1</h3>
        <p>Some description about card 1.</p>
    </div>
    <div class="card">
        <img src="https://picsum.photos/id/102/300/200" alt="Card 2">
        <h3>Card 2</h3>
        <p>Some description about card 2.</p>
    </div>
    <div class="card">
        <img src="https://picsum.photos/id/103/300/200" alt="Card 3">
        <h3>Card 3</h3>
        <p>Some description about card 3.</p>
    </div>
    <div class="card">
        <img src="https://picsum.photos/id/104/300/200" alt="Card 4">
        <h3>Card 4</h3>
        <p>Some description about card 4.</p>
    </div>
</div>

</body>
</html>
