<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Form</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #f9f9f9;
    }

    h1 {
        text-align: center;
    }

    form {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background:aliceblue;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .form-row {
        display: flex;
        gap: 20px;
        margin-bottom: 15px;
    }

    .form-row input,
    .form-row select,
    .form-row textarea {
        flex: 1;
        padding: 10px;
        font-size: 1rem;
    }

    button {
        padding: 10px 20px;
        font-size: 1rem;
        background: #333;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #555;
    }

    /* 📱 Mobile View */
    @media (max-width: 768px) {
        .form-row {
            flex-direction: column; /* stacked vertically */
        }
    }
</style>
</head>

<body>

<h1>Responsive Form Example</h1>

<form>
    <div class="form-row">
        <input type="text" placeholder="First Name">
        <input type="text" placeholder="Last Name">
    </div>

    <div class="form-row">
        <input type="email" placeholder="Email">
        <input type="tel" placeholder="Phone">
    </div>

    <div class="form-row">
        <textarea placeholder="Message"></textarea>
    </div>

    <button type="submit">Submit</button>
</form>

</body>
</html>
