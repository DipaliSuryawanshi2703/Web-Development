<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image Gallery</title>

<style>
    body {
        font-family: Arial;
        margin: 0;
        padding: 20px;
        background: #f9f9f9;
    }

    h1 {
        text-align: center;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
    }

    .gallery img {
        width: 100%;
        display: block;
        border-radius: 5px;
    }

    /* Mobile */
    @media (max-width: 480px) {
        .gallery {
            grid-template-columns: 1fr; /* 1 image per row */
        }
    }

    /* Tablet */
    @media (min-width: 481px) and (max-width: 768px) {
        .gallery {
            grid-template-columns: repeat(2, 1fr); /* 2 images per row */
        }
    }

    /* Desktop */
    @media (min-width: 769px) {
        .gallery {
            grid-template-columns: repeat(4, 1fr); /* 4 images per row */
        }
    }
</style>
</head>
<body>

<h1>Responsive Image Gallery</h1>

<div class="gallery">
    <img src="https://picsum.photos/id/101/300/200" alt="Image 1">
    <img src="https://picsum.photos/id/102/300/200" alt="Image 2">
    <img src="https://picsum.photos/id/103/300/200" alt="Image 3">
    <img src="https://picsum.photos/id/104/300/200" alt="Image 4">
    <img src="https://picsum.photos/id/106/300/200" alt="Image 6">
</div>

</body>
</html>
